# App info
spring.application.name=notification-service
server.port=8082

# Kafka config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# MySQL (optional)
spring.datasource.url=jdbc:mysql://localhost:3306/notificationdb
spring.datasource.username=root
spring.datasource.password=root123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Topics (must match DriverService)
app.kafka.topic.driver-registered=driver.registered
app.kafka.topic.driver-status=driver.status.changed
app.kafka.topic.driver-location=driver.location.updated
